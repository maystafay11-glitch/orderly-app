# Gradle memory settings for an 8GB machine.
# The default (-Xmx8G) exceeds the machine RAM and breaks the Kotlin daemon.
# Warning: a bare value like -XX:MaxMetaspaceSize=16 means 16 BYTES and breaks Gradle.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# Memory for the Kotlin compile daemon (runs as a separate process).
kotlin.daemon.jvmargs=-Xmx1G

# Kotlin incremental caches fail to close on Windows (file locks from
# antivirus/indexer) which aborts the build and then hangs in the fallback
# path (see: "Could not close incremental caches ... caches-jvm").
# Disabling incremental compilation keeps builds reliable; the project is small.
kotlin.incremental=false

# Compile Kotlin inside the Gradle daemon instead of the Kotlin daemon,
# so a daemon crash/fallback can never leave the build hanging.
kotlin.compiler.execution.strategy=in-process

# File-system watching keeps handles on the build directory on Windows;
# disabling it removes a common source of file-lock contention.
org.gradle.vfs.watch=false

# Keep the worker count low: this machine has 8GB RAM and no swap headroom.
org.gradle.workers.max=2

android.useAndroidX=true